# Site identity (used for <title>, meta descriptions, canonical and Open Graph tags)
title               : Ivan Dedyukhin
description         : >-
  Ivan Dedyukhin is a PhD candidate in economics at Indiana University Bloomington,
  working in experimental economics, game theory and behavioral economics.
author              : Ivan Dedyukhin
# TODO(confirm): files/Academic_CV.pdf lists dedyukhin.com as the website, but this
# repository contains no CNAME file. If the custom domain is not active, change this
# to https://dedyukhin.github.io so canonical and Open Graph URLs stay correct.
url                 : "https://dedyukhin.com"

# Where things are
source              : .
destination         : ./_site
collections_dir     : .
plugins_dir         : _plugins # takes an array of strings and loads plugins in that order
layouts_dir         : _layouts
data_dir            : _data
includes_dir        : _includes
# sass:
#   sass_dir: _sass  # Not needed - using assets/css/main.css
collections:
  posts:
    output          : true

#Theme
# remote_theme: pages-themes/slate@v0.2.0  # Disabled - using custom layout

# Handling Reading
safe                : false
include             : [".htaccess"]
exclude             : ["Gemfile", "Gemfile.lock", "node_modules", "vendor/bundle/", "vendor/cache/", "vendor/gems/", "vendor/ruby/", "scripts/", "api/", "vercel.json", "DEPLOYMENT.md", "AI_ASSISTANT_README.md", ".gitignore", ".github/"]
keep_files          : [".git", ".svn"]
encoding            : "utf-8"
markdown_ext        : "markdown,mkdown,mkdn,mkd,md"
strict_front_matter : false

# Filtering Content
show_drafts         : null
limit_posts         : 0
future              : false
unpublished         : false

# Plugins
whitelist           : []
# `remote_theme` is disabled above (this site uses its own layout in _layouts/),
# so jekyll-remote-theme is not loaded. Re-add "- jekyll-remote-theme" below if a
# remote theme is ever enabled.
plugins             : []

# Conversion
markdown            : kramdown
highlighter         : rouge
lsi                 : false
excerpt_separator   : "\n\n"
incremental         : false

# Serving
detach              : false
port                : 4000
host                : 127.0.0.1
baseurl             : "" # does not include hostname
show_dir_listing    : false

# Outputting
permalink           : date
paginate_path       : /page:num
timezone            : null

quiet               : false
verbose             : false
defaults            : []

liquid:
  error_mode        : warn
  strict_filters    : false
  strict_variables  : false

# Markdown Processors
kramdown:
  auto_ids          : true
  entity_output     : as_char
  toc_levels        : [1, 2, 3, 4, 5, 6]
  smart_quotes      : lsquo,rsquo,ldquo,rdquo
  input             : GFM
  hard_wrap         : false
  footnote_nr       : 1
  show_warnings     : false
