- id: when-cooperation-extends-shadow-of-future
  title: When Cooperation Extends the Shadow of the Future
  category: working-paper
  venue: SSRN Working Paper
  year: 2026
  status: SSRN working paper, October 2026
  featured: true
  summary: >-
    An indefinitely repeated prisoner’s dilemma in which the continuation probability
    depends on how many players cooperate. A 2×2 laboratory experiment tests whether the
    payoff from mutual cooperation and the continuation probability it induces act as
    substitutes in sustaining cooperation.
  abstract: >-
    I introduce an indefinitely repeated prisoner’s dilemma in which the continuation
    probability depends on how many players cooperate. Theoretically, the payoff from
    mutual cooperation and the continuation probability it induces act as substitutes in
    sustaining cooperative equilibria. I test this in a laboratory experiment with a 2×2
    between-subjects design that independently varies these two parameters. Three results
    emerge. First, an increase in the continuation probability associated with joint
    cooperation promotes cooperation only when it makes cooperation sustainable in
    equilibrium. Second, early in the experiment, payoff incentives raise cooperation more
    than theoretically equivalent continuation incentives; this asymmetry disappears with
    experience. Third, estimated strategies display substitutability between the two
    forces once treatments are matched on strategic uncertainty.
  links:
    - label: Paper (PDF)
      url: /files/WCDC_WP_10-19-26.pdf
      kind: pdf
    - label: SSRN
      url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7637778
      kind: external

- id: human-expertise-age-of-ai
  # Quoted because the title contains a colon: unquoted YAML values cannot.
  title: "Human Expertise in the Age of AI: Playing Against AI-Assisted Opponents"
  authors: with Ala Avoyan
  category: work-in-progress
  featured: true
  summary: >-
    A hybrid lab-online experiment with the 11-20 money request game asks how people
    play against a counterpart who has access to AI, and whether the answer depends on
    the counterpart’s expertise and on the player’s age cohort.
  abstract: >-
    Most of what we know about how AI changes economic decisions concerns the person who
    uses it. However, in many interactions what also matters is what our beliefs are of
    our opponent using AI assistance. In this paper we ask how people play against a
    counterpart who has access to AI, and whether the answer depends on the expertise of
    the opponent. In a hybrid experiment, online participants from four age cohorts play
    the 11-20 money request game against lab participants who are novices or experts in
    strategic reasoning, with or without an AI assistant. We truthfully communicate
    opponent information to the participants. We find that opponent description has no
    effect on people’s requests on average, but people think considerably longer when the
    opponent is an expert with AI. We conclude that they treat AI as something that
    amplifies expertise rather than replaces it in this context. Baby Boomers and
    Millennials hold opposite views of AI effect, which is what hides the overall effect
    leading to the flat averages.
  links:
    - label: Paper (PDF)
      url: /files/WP_AI-expertise_10-30-26.pdf
      kind: pdf

- id: quasi-hyperbolic-discounting
  # Quoted because the title contains a colon: unquoted YAML values cannot.
  title: "Quasi-Hyperbolic Discounting in IRPD: An Experiment"
  category: work-in-progress
  featured: true
  summary: >- 
    I study how present-biased time preferences shape cooperation and strategic uncertainty in repeated interactions.
  abstract: >- 
    This paper studies how non-exponential discounting affects cooperation in repeated strategic interactions. While the experimental literature on infinitely repeated games typically assumes exponential discounting, evidence on intertemporal choice suggests that individuals may place disproportionate weight on immediate outcomes relative to future consequences. I examine how incorporating present-biased preferences changes incentives for cooperation in the infinitely repeated Prisoner’s Dilemma and whether behavior differs from predictions based on standard exponential discounting. I develop theoretical predictions and an experimental design that allows cooperation to be compared across different intertemporal incentive structures. The project aims to better understand the role of time preferences in sustaining cooperation and, more broadly, how the structure of intertemporal incentives interacts with strategic uncertainty in repeated games.
