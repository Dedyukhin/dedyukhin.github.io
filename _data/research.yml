- id: nursing-homes-ownership
  title: >-
    Ownership, Asymmetric Information, and Quality of Care for the Elderly:
    Evidence From US Nursing Homes During the COVID-19 Pandemic
  authors: with Michael Alexeev and Leonid Polishchuk
  category: working-paper
  venue: SSRN Working Paper
  year: 2024
  status: SSRN working paper, August 2024
  featured: true
  summary: >-
    Theory and evidence on how greater observability of quality narrows the care gap
    between nonprofit and for-profit providers, using US nursing homes during the
    COVID-19 pandemic as a natural test.
  abstract: >-
    A common cause of market failures is asymmetric information. For this reason, the
    reliance on market incentives and signals requires that quality of goods and services
    is properly observable and verifiable. This requirement is hard to meet in the case of
    credence goods, including most social services. In such environment, nonprofit
    providers can offer additional quality assurance compared to for-profit entities. When
    quality becomes better observable and verifiable, and hence could earn a market
    premium, market incentives are closer aligned with social welfare, and the quality gap
    expected between nonprofit and for-profit provision is likely to narrow. We explore
    this conjecture theoretically and empirically, using in the empirical part the case of
    US nursing homes during the COVID-19 pandemic. The pandemic supplied new tangible and
    publicly observable nursing home performance measures such as infection and death
    rates among residents. These measures could serve as care quality indicators, revealing
    aspects and attributes of the nursing home care that remained hidden before the
    pandemic. The data reveal significant initial gaps between for-profit and nonprofit
    nursing homes in COVID-19 infection rates. However, in the ensuing catching-up process
    triggered by increased transparency, these gaps steadily declined, eventually leading
    to statistical parity between two types of ownership. We explore the role of local
    market structure in the adjustment of nursing home industry to the pandemic;
    retroactively evaluate the reliability of the official ranking system in predicting
    nursing homes’ performance; and look for evidence of sustainable learning-by-doing
    effect of the pandemic.
  links:
    - label: Paper (PDF)
      url: /files/Nursing_Homes_WP_Aug2024.pdf
      kind: pdf
    - label: SSRN
      url: https://ssrn.com/abstract=4906864
      kind: external

- id: local-fiscal-health-russia
  title: "Local Fiscal Health in Russia: An Achilles’ Heel of Fiscal Federalism?"
  authors: with Andrey Yushkov and Michael Alexeev
  category: publication
  venue: International Journal of Public Administration
  year: 2024
  detail: 1–15
  featured: true
  summary: >-
    The first systematic study of local public finance in contemporary Russia,
    documenting thin own-source revenues, growing dependence on intergovernmental
    transfers, and weak local fiscal incentives.
  abstract: >-
    This article is the first attempt to systematically study local public finance in
    contemporary Russia. We document that local governments do not have sufficient
    own-source revenues, are increasingly more dependent on intergovernmental fiscal aid,
    lack access to market borrowing, and suffer from structural flaws in the design of
    intergovernmental fiscal relations. Additionally, we present the results of the
    modified Brown’s 10-point test to compare local fiscal health across the Russian
    regions. Finally, we assess the strength of local fiscal incentives in 2012–2021 and
    demonstrate that local governments in Russia lack capacity to foster local economic
    growth through the tax code.
  links:
    - label: Journal article
      url: https://www.tandfonline.com/doi/full/10.1080/01900692.2024.2399133
      kind: external
