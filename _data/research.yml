- id: when-cooperation-drives-continuation
  title: When Cooperation Drives Continuation
  category: work-in-progress
  featured: true
  summary: >-
    An indefinitely repeated prisoner’s dilemma in which mutual cooperation makes
    future interaction more likely. A 2×2 laboratory experiment tests whether the
    reward from cooperating and the continuation probability that follows it act as
    substitutes in sustaining cooperation.
  abstract: >-
    I introduce an indefinitely repeated prisoner’s dilemma in which the continuation
    probability depends on the number of cooperating players: mutual cooperation makes
    future interaction more likely. Theoretically, the cooperation reward and the
    post-cooperation continuation probability function as substitutes in sustaining
    cooperative equilibria. I test this in a laboratory experiment using a 2×2
    between-subjects design that independently varies the reward from mutual cooperation
    and the continuation probability following mutual cooperation. Three main results
    emerge. First, cooperation increases when a higher continuation probability makes
    cooperative play supportable as an equilibrium, but not when cooperation is already
    supportable. Second, early in the experiment, higher payoff rewards have a stronger
    effect on cooperation than higher continuation probabilities; this asymmetry
    disappears with experience. Third, strategy estimation reveals substitutability
    between payoff and continuation incentives at matched levels of strategic uncertainty.
