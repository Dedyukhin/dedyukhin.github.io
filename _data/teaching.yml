    blurb: >-
      A required introductory economics course for Indiana University's Kelley School
      of Business.
    description: >-
      The first course in a two-course sequence that introduces business students to
      essential economic concepts. Examines the economic notions of cost and gains from
      trade, determinants of economic growth, consumer and firm behavior in competitive
      and non-competitive environments, the effects of taxation, externalities, moral
      hazard, and adverse selection, and basic game theory.
