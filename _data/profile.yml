name: Ivan Dedyukhin
role: PhD Candidate in Economics
institution: Indiana University Bloomington
institution_url: https://economics.indiana.edu/
department: Department of Economics

# Short research description (from the previous homepage copy).
summary: >-
  I study cooperation under strategic uncertainty, and how people perceive
  AI assistance relative to human strategic expertise.

# Longer version used on the homepage profile.
bio_research: >-
  I study how people sustain cooperation under strategic uncertainty, focusing on
  settings where present actions influence the likelihood of future interaction.
  A second strand of my work asks whether people perceive AI assistance as a
  substitute for strategic expertise, and how those perceptions differ across
  generations.

fields:
  - Experimental Economics
  - Game Theory
  - Behavioral Economics

