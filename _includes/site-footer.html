{%- assign profile = site.data.profile -%}
<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__identity">
      <p class="site-footer__name">{{ profile.name }}</p>
      <p class="site-footer__meta">{{ profile.role }}, {{ profile.department }}, {{ profile.institution }}</p>
      <p class="site-footer__meta">{{ profile.office }}</p>
    </div>

    <div class="site-footer__links">
      <h2 class="u-visually-hidden">Contact and profiles</h2>
      {% include social-links.html class="link-row--footer" %}
    </div>
  </div>

  <p class="site-footer__legal">&copy; {{ "now" | date: "%Y" }} {{ profile.name }}</p>
</footer>
